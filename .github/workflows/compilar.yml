# Cada cambio en main compila el APK y lo publica en "Releases" como la versión más reciente.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar herramientas de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" > /dev/null

      - name: Compilar
        run: ./build.sh

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.$(git rev-list --count HEAD)"
          NOTAS="Versión más reciente. Descarga Rastreadores.apk en el celular e instálalo encima de la anterior."
          if gh release view ultima > /dev/null 2>&1; then
            gh release upload ultima build/Rastreadores.apk --clobber
            gh release edit ultima --title "Rastreadores $VERSION" --notes "$NOTAS"
          else
            gh release create ultima build/Rastreadores.apk --title "Rastreadores $VERSION" --notes "$NOTAS"
          fi
